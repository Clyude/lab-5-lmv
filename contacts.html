<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Контактна інформація туристичної компанії OtZaharaDoSahari: телефон, електронна пошта, адреса та форма зв'язку.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtZaharaDoSahari - Контакти</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page contacts-bg">
    
<nav class="navbar navbar-expand-lg site-header">
    <a class="navbar-brand" href="index.html">✣ OtZaharaDoSahari</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
            aria-controls="mainMenu" aria-expanded="false" aria-label="Відкрити меню">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-between" id="mainMenu">
        <div class="navbar-nav mx-auto">
            <a class="nav-link" href="index.html">Головна</a>
            <a class="nav-link" href="tours.html">Гарячі тури</a>
        </div>
        <a class="contact-btn" href="contacts.html">Contacts</a>
    </div>
</nav>

    <main class="main-content">
        <section class="contacts-box">
            <h1>Наші контакти:</h1>
            <p>📞 <a href="tel:+380935418142">380935418142</a> - гаряча лінія</p>
            <p>📧 <a href="mailto:zardanser@gmail.com">zardanser@gmail.com</a></p>
            <p>📍 Вулиця незалежності 21</p>

            <form class="contact-form" action="#" method="post">
                <h2>Форма зв'язку</h2>
                <label for="name" class="form-label">Ім'я</label>
                <input class="form-control" type="text" id="name" name="name" autocomplete="name" required>

                <label for="email" class="form-label">Email</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" inputmode="email" required>

                <label for="message" class="form-label">Повідомлення</label>
                <textarea class="form-control" id="message" name="message" rows="3" autocomplete="off" required></textarea>

                <button class="booking-btn" type="submit">Відправити</button>
                <p class="form-status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer class="site-footer">© 2026 OtZaharaDoSahari. Зв'яжіться з нами у будь-який час.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
